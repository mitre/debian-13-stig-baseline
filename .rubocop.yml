AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  # Defining Exclude replaces rubocop's defaults (which cover vendor/), so
  # restate vendor/ explicitly: it holds bundler-installed gems and
  # cinc-auditor-vendored dependency profiles, neither of which we lint.
  Exclude:
  - "libraries/**/*"
  - "vendor/**/*"
  - ".git/**/*"

Layout/LineLength:
  Max: 1500
  AllowURI: true
  AllowCopDirectives: true

Naming/FileName:
  Enabled: false

Metrics/BlockLength:
  Max: 1000

Lint/ConstantDefinitionInBlock:
  Enabled: false

# Required for Profiles as it can introduce profile errors
Style/NumericPredicate:
  Enabled: false

Style/WordArray:
  Description: "Use %w or %W for an array of words. (https://rubystyle.guide#percent-w)"
  Enabled: false

Style/RedundantPercentQ:
  Enabled: true

Style/NestedParenthesizedCalls:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  Description: "https://docs.rubocop.org/rubocop/cops_style.html#styletrailingcommainhashliteral"
  Enabled: true
  EnforcedStyleForMultiline: no_comma

Style/TrailingCommaInArrayLiteral:
  Enabled: true
  EnforcedStyleForMultiline: no_comma

Style/BlockDelimiters:
  Enabled: false

Lint/AmbiguousBlockAssociation:
  Enabled: false

Metrics/BlockNesting:
  Enabled: false

Lint/ShadowingOuterLocalVariable:
  Enabled: false

Style/FormatStringToken:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false
